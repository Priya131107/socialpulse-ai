# Streamlit Community Cloud configuration
# This file tells Streamlit Cloud which file to run and Python version to use

[server]
headless = true
port = 8501

[theme]
base = "dark"
primaryColor = "#7C3AED"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
font = "sans serif"
